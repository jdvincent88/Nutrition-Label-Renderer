<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="540" viewBox="0 0 280 540">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: black; }
    </style>
  </defs>

  <!-- Outer border -->
  <rect x="1" y="1" width="278" height="538" fill="white" stroke="black" stroke-width="3"/>

  <!-- Title: Nutrition Facts -->
  <text x="10" y="52" font-size="38" font-weight="900" letter-spacing="-0.5">Nutrition Facts</text>

  <!-- Thick line under title -->
  <rect x="5" y="58" width="270" height="5" fill="black"/>

  <!-- Servings per container -->
  <text x="10" y="78" font-size="10">{{SERVINGS_PER_CONTAINER}} servings per container</text>

  <!-- Serving size row -->
  <text x="10" y="96" font-size="11" font-weight="bold">Serving size</text>
  <text x="272" y="96" font-size="11" font-weight="bold" text-anchor="end">{{SERVING_SIZE}}</text>

  <!-- Heavy black bar -->
  <rect x="5" y="101" width="270" height="14" fill="black"/>

  <!-- Amount per serving + % Daily Value header -->
  <text x="10" y="125" font-size="8.5">Amount Per Serving</text>
  <text x="272" y="125" font-size="9" text-anchor="end" font-weight="bold">% Daily Value*</text>

  <!-- Thick line -->
  <rect x="5" y="130" width="270" height="3" fill="black"/>

  <!-- Calories -->
  <text x="10" y="155" font-size="14" font-weight="bold">Calories</text>
  <text x="272" y="155" font-size="30" font-weight="900" text-anchor="end">{{CALORIES}}</text>

  <!-- Medium line -->
  <rect x="5" y="162" width="270" height="3" fill="black"/>

  <!-- Total Fat -->
  <text x="10" y="174" font-size="9"><tspan font-weight="bold">Total Fat</tspan> {{TOTAL_FAT_AMT}}</text>
  <text x="272" y="174" font-size="9" text-anchor="end" font-weight="bold">{{TOTAL_FAT_DV}}</text>
  <line x1="5" y1="178" x2="275" y2="178" stroke="black" stroke-width="0.5"/>

  <!-- Saturated Fat -->
  <text x="22" y="190" font-size="9">Saturated Fat {{SAT_FAT_AMT}}</text>
  <text x="272" y="190" font-size="9" text-anchor="end" font-weight="bold">{{SAT_FAT_DV}}</text>
  <line x1="5" y1="194" x2="275" y2="194" stroke="black" stroke-width="0.5"/>

  <!-- Trans Fat -->
  <text x="22" y="206" font-size="9"><tspan font-style="italic">Trans</tspan> Fat {{TRANS_FAT_AMT}}</text>
  <line x1="5" y1="210" x2="275" y2="210" stroke="black" stroke-width="0.5"/>

  <!-- Cholesterol -->
  <text x="10" y="222" font-size="9"><tspan font-weight="bold">Cholesterol</tspan> {{CHOLESTEROL_AMT}}</text>
  <text x="272" y="222" font-size="9" text-anchor="end" font-weight="bold">{{CHOLESTEROL_DV}}</text>
  <line x1="5" y1="226" x2="275" y2="226" stroke="black" stroke-width="0.5"/>

  <!-- Sodium -->
  <text x="10" y="238" font-size="9"><tspan font-weight="bold">Sodium</tspan> {{SODIUM_AMT}}</text>
  <text x="272" y="238" font-size="9" text-anchor="end" font-weight="bold">{{SODIUM_DV}}</text>
  <line x1="5" y1="242" x2="275" y2="242" stroke="black" stroke-width="0.5"/>

  <!-- Total Carbohydrate -->
  <text x="10" y="254" font-size="9"><tspan font-weight="bold">Total Carbohydrate</tspan> {{CARBS_AMT}}</text>
  <text x="272" y="254" font-size="9" text-anchor="end" font-weight="bold">{{CARBS_DV}}</text>
  <line x1="5" y1="258" x2="275" y2="258" stroke="black" stroke-width="0.5"/>

  <!-- Dietary Fiber -->
  <text x="22" y="270" font-size="9">Dietary Fiber {{FIBER_AMT}}</text>
  <text x="272" y="270" font-size="9" text-anchor="end" font-weight="bold">{{FIBER_DV}}</text>
  <line x1="5" y1="274" x2="275" y2="274" stroke="black" stroke-width="0.5"/>

  <!-- Total Sugars -->
  <text x="22" y="286" font-size="9">Total Sugars {{SUGARS_AMT}}</text>
  <line x1="5" y1="290" x2="275" y2="290" stroke="black" stroke-width="0.5"/>

  <!-- Added Sugars -->
  <text x="38" y="302" font-size="9">Includes {{ADD_SUG_AMT}} Added Sugars</text>
  <text x="272" y="302" font-size="9" text-anchor="end" font-weight="bold">{{ADD_SUG_DV}}</text>
  <line x1="5" y1="306" x2="275" y2="306" stroke="black" stroke-width="0.5"/>

  <!-- Protein -->
  <text x="10" y="318" font-size="9"><tspan font-weight="bold">Protein</tspan> {{PROTEIN_AMT}}</text>
  <text x="272" y="318" font-size="9" text-anchor="end" font-weight="bold">{{PROTEIN_DV}}</text>

  <!-- Heavy divider before micronutrients -->
  <rect x="5" y="323" width="270" height="5" fill="black"/>

  <!-- Vitamin D -->
  <text x="10" y="338" font-size="9">Vitamin D {{VITD_AMT}}</text>
  <text x="272" y="338" font-size="9" text-anchor="end">{{VITD_DV}}</text>
  <line x1="5" y1="342" x2="275" y2="342" stroke="black" stroke-width="0.5"/>

  <!-- Calcium -->
  <text x="10" y="354" font-size="9">Calcium {{CALCIUM_AMT}}</text>
  <text x="272" y="354" font-size="9" text-anchor="end">{{CALCIUM_DV}}</text>
  <line x1="5" y1="358" x2="275" y2="358" stroke="black" stroke-width="0.5"/>

  <!-- Iron -->
  <text x="10" y="370" font-size="9">Iron {{IRON_AMT}}</text>
  <text x="272" y="370" font-size="9" text-anchor="end">{{IRON_DV}}</text>
  <line x1="5" y1="374" x2="275" y2="374" stroke="black" stroke-width="0.5"/>

  <!-- Potassium -->
  <text x="10" y="386" font-size="9">Potassium {{POTASSIUM_AMT}}</text>
  <text x="272" y="386" font-size="9" text-anchor="end">{{POTASSIUM_DV}}</text>
  <line x1="5" y1="390" x2="275" y2="390" stroke="black" stroke-width="0.5"/>

  <!-- Optional: Vitamin C -->
  <text x="10" y="402" font-size="9">Vitamin C {{VITC_AMT}}</text>
  <text x="272" y="402" font-size="9" text-anchor="end">{{VITC_DV}}</text>
  <line x1="5" y1="406" x2="275" y2="406" stroke="black" stroke-width="0.5"/>

  <!-- Optional: Vitamin B6 -->
  <text x="10" y="418" font-size="9">Vitamin B6 {{VITB6_AMT}}</text>
  <text x="272" y="418" font-size="9" text-anchor="end">{{VITB6_DV}}</text>

  <!-- Thin line before footnote -->
  <line x1="5" y1="423" x2="275" y2="423" stroke="black" stroke-width="0.5"/>

  <!-- Footnote -->
  <text x="10" y="436" font-size="7.5">* The % Daily Value (DV) tells you how much a nutrient in a serving of</text>
  <text x="10" y="447" font-size="7.5">food contributes to a daily diet. 2,000 calories a day is used for</text>
  <text x="10" y="458" font-size="7.5">general nutrition advice.</text>
</svg>
